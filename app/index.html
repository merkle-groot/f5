<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6eddd" />
    <link rel="icon" href="/f5-eye.svg" type="image/svg+xml" />
    <title>f5 | Shielded Vault</title>
    <meta name="description" content="Private notes that travel across Ethereum and every L2. Keys stay local, self-custodied." />

    <!--
      Link previews for Telegram, X, Discord and Slack. These have to live in the static
      document: every one of those crawlers reads the HTML and none of them run the app's
      JavaScript, so a tag written at runtime by main.js would never be seen.

      Caddy rewrites unknown paths to this same file, so one set of tags covers /vault and
      every other route. og:image and og:url are absolute because Telegram does not resolve
      relative ones, which is also why the domain is spelled out rather than derived.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="f5" />
    <meta property="og:url" content="https://f5.primemodulus.com/" />
    <meta property="og:title" content="f5 — Deposit once. Stay shielded everywhere." />
    <meta property="og:description" content="A single Privacy Pool on Ethereum L1 that bridges withdrawals into shielded pools on L2 as stealth commitments. No public address touches the value on either side. Testnet." />
    <!--
      1600x900. Telegram imposes no aspect ratio and renders this uncropped; X's
      summary_large_image card is 1.91:1, so it trims a little off the top and bottom,
      which the headline and the LAUNCH button sit well clear of.
    -->
    <meta property="og:image" content="https://f5.primemodulus.com/f5-og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="900" />
    <meta property="og:image:alt" content="Deposit once. Stay shielded everywhere. Private notes that travel across Ethereum and every L2. Keys stay local, self-custodied." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@0x1379" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
